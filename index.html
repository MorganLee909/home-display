<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style></style>
    </head>
    <body>
        <div class="grid">
            <div class="topLeft">
                <div class="dateTime">
                    <p id="date"></p>
                    <p id="time"></p>
                </div>
                <div class="weather">
                    <div id="currentWeather" class="weatherBlock">
                        <h2>Current Weather</h2>
                        <div class="condition">
                            <img> 
                            <p class="conditionText"></p>
                        </div>
                        <div class="weatherInfo">
                            <p id="temp"></p>
                            <p id="feels"></p>
                            <p id="wind"></p>
                            <p id="humidity"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="topRight">
                <img id="radar" src="https://radar.weather.gov/ridge/standard/KLTX_0.gif" alt="radar">
            </div>
            <div class="bottomLeft">
                <table>
                    <thead id="forecastHead">
                        <tr>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="forecastBody">
                        <tr>
                            <td>Temp (&deg;F)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Humidity</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Chance Of Rain</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Precipitation (inches)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Max Wind (MPH)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Sunrise</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Sunset</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="bottomRight">
                <iframe src="https://www.youtube-nocookie.com/embed/4nMfRpesYfw?si=O9Up2lQKNo8v9gi2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <script></script>
    </body>
</html>
