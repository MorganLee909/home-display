<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style></style>
    </head>
    <body>
        <div class="grid">
            <div class="topLeft">
                <div class="dateTime">
                    <p id="date"></p>
                    <p id="time"></p>
                    <img id="conditionLogo">
                </div>
                <div class="weather">
                    <div id="currentWeather" class="weatherBlock">
                        <div class="weatherInfo">
                            <p id="temp" class="weatherItem"></p>
                            <p id="feels" class="weatherItem"></p>
                            <div id="wind" class="weatherItem">
                                <p></p>
                                <svg width="24px" height="24px" viewBox="0 0 24 24" stroke-width="1.5" fill="none" color="#000000"><path d="M12 21L12 3M12 3L20.5 11.5M12 3L3.5 11.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </div>
                            <p id="humidity" class="weatherItem"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="topRight">
                <img id="radar" src="https://radar.weather.gov/ridge/standard/KLTX_0.gif" alt="radar">
            </div>
            <div class="bottomLeft">
                <table>
                    <thead id="forecastHead">
                        <tr>
                            <th></th>
                            <th></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="forecastBody">
                        <tr>
                            <td>Temp (&deg;F)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Humidity</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>%Rain</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Precip. (in.)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Wind (mph)</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Sunrise</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>Sunset</td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="bottomRight">
                <iframe src="https://www.youtube-nocookie.com/embed/sIv6YmBeO3Q?si=BYWfjLM0sLCYo2Ok" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <script></script>
    </body>
</html>
