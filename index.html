<!DOCTYPE html> <html> <head> <meta charset="utf-8"> <style>:root{--bg: #0b0f16;--surface: rgba(255,255,255,.06);--surface-2: rgba(255,255,255,.09);--border: rgba(255,255,255,.1);--text: rgba(255,255,255,.92);--muted: rgba(255,255,255,.68);--faint: rgba(255,255,255,.52);--accent: #4cc9f0;--accent-2: #a78bfa;--good: #34d399;--warn: #fbbf24;--radius: 18px;--radius-sm: 12px;--pad: 18px;--gap: 16px;--font: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif}*{box-sizing:border-box}html,body{height:100%;width:100%}body{margin:0;font-family:var(--font);color:var(--text);background:radial-gradient(1200px 600px at 20% 10%,rgba(76,201,240,.12),transparent 60%),radial-gradient(900px 500px at 85% 20%,rgba(167,139,250,.1),transparent 55%),radial-gradient(800px 600px at 50% 100%,rgba(255,255,255,.06),transparent 55%),var(--bg);overflow:hidden}body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}.grid{height:100vh;width:100vw;padding:18px;display:grid;grid-template-columns:1.1fr 1.4fr;grid-template-rows:1fr 1fr;gap:var(--gap)}.topLeft,.topRight,.bottomLeft,.bottomRight{position:relative;min-height:0;border-radius:var(--radius);background:linear-gradient(180deg,#ffffff0f,#ffffff08);border:1px solid var(--border);box-shadow:0 10px 30px #00000059,inset 0 1px #ffffff0f;overflow:hidden}.topLeft{display:flex;flex-direction:column;padding:var(--pad);gap:14px}.dateTime{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--radius-sm);background:#00000038;border:1px solid rgba(255,255,255,.08)}#date{margin:0;font-size:22px;letter-spacing:.4px;color:var(--muted)}#time{margin:0;font-size:56px;font-weight:700;letter-spacing:1.2px;line-height:1.05;color:var(--text)}.weather{flex:1;min-height:0;display:flex}.weatherBlock{flex:1;min-height:0;padding:16px;border-radius:var(--radius-sm);background:radial-gradient(600px 240px at 20% 10%,rgba(76,201,240,.1),transparent 60%),#0000002e;border:1px solid rgba(255,2 (255,255,255,.08)}thead th{padding:12px 10px;font-size:15px;color:#fffc;letter-spacing:.4px;text-transform:uppercase;background:linear-gradient(90deg,#4cc9f01a,#a78bfa14);border-bottom:1px solid rgba(255,255,255,.1)}tbody td{padding:12px 10px;font-size:16px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}tbody td:first-child{width:38%;color:#ffffffdb;font-weight:650;letter-spacing:.2px;background:#ffffff08;border-right:1px solid rgba(255,255,255,.06)}tbody td:not(:first-child),thead th:not(:first-child){text-align:center}tbody tr:nth-child(odd) td{background:#ffffff05}tbody tr:nth-child(2n) td{background:#ffffff07}tbody tr:nth-child(odd) td:first-child{background:#ffffff0a}tbody tr:nth-child(2n) td:first-child{background:#ffffff0e}tbody tr:last-child td{border-bottom:none}.bottomRight{padding:10px;background:radial-gradient(900px 600px at 20% 20%,rgba(76,201,240,.08),transparent 55%),#0000001a}.bottomRight iframe{width:100%;height:100%;border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--radius) - 6px);box-shadow:0 18px 50px #0000008c;background:#000}:focus{outline:2px solid rgba(76,201,240,.55);outline-offset:2px}@media(max-width:1100px){.grid{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}#time{font-size:48px}.weatherInfo{grid-template-columns:1fr}}.grid{filter:brightness(.98)}
